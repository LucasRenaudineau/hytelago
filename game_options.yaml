name: player_name
game: hytale
description: Yaml option file for Hytelago.
hytale:
  progression_balancing: '50'
  accessibility: full
  # Hytelago options
  percent_goal: 80       # percentage of locations that must be completed to release the player
  death_link: true       # if set to false, cannot be changed in-game; if set to true, can be changed in-game with command /arch-death-link <on|off>
  traps: false           # fill monster-spawn traps
  death_locations: false # add the "die in a specific way" locations
  memories: true         # add the memories_N locations
  memories_max: 150      # highest memory milestone used (1-150)
  memories_every: 1      # step between memory milestones (2 -> memories_1, 3, 5...)
  regions: true          # add the region-exploration locations
  local_items: []
  non_local_items: []
  start_hints: []
  start_location_hints: []
  exclude_locations: []
  priority_locations: []
  start_inventory: {}
